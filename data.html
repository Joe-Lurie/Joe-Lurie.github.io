            --accent: #3b82f6;

            --red: #f43f5e;
            --yellow: #facc15;
            --orange: #f97316;
            --text: #e2e8f0;

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }
        .top-nav { background: #151a30; height: 60px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 100; }

        .nav-links { display: flex; gap: 24px; margin-left: auto; }
        .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }

        .main-content { margin-top: 60px; padding: 32px 24px; max-width: 1400px; margin-left: auto; margin-right: auto; }

        .page-title { font-family: var(--mono); font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: var(--muted); }

        .toolbar { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
        .search-wrap { position: relative; flex: 1; min-width: 260px; max-width: 460px; }
        .search-input { width: 100%; padding: 10px 14px 10px 38px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 13px; transition: border-color 0.15s; }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .search-input::placeholder { color: var(--muted); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
        .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-chip { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; padding: 7px 12px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 4px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
        .filter-chip:hover { color: var(--text); border-color: var(--border-bright); }
        .filter-chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .ticker-count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }

        .ticker-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .ticker-btn { position: relative; font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 8px 32px 8px 14px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 4px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
        .ticker-btn:hover { border-color: var(--accent); color: var(--text); }
        .ticker-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .ticker-star { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); cursor: pointer; border-radius: 3px; opacity: 0.45; transition: all 0.15s; }
        .ticker-star:hover { opacity: 1; background: rgba(255,255,255,0.06); transform: translateY(-50%) scale(1.15); }
        .ticker-star.filled { color: var(--yellow); opacity: 1; }
        .ticker-btn.active .ticker-star { opacity: 0.65; }
        .ticker-btn.active .ticker-star.filled { opacity: 1; }
        .no-results { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 24px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 6px; }

        .status-bar { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 20px; min-height: 18px; }
        .status-bar .loading { color: var(--accent); }
        .status-bar .error { color: var(--red); }
        .status-bar .ok { color: var(--green); }

        .quote-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 28px; display: none; }
        .quote-card.visible { display: block; }
        .quote-top { display: flex; align-items: flex-start; gap: 32px; margin-bottom: 20px; flex-wrap: wrap; }
        .quote-symbol { font-family: var(--mono); font-size: 36px; font-weight: 700; color: var(--accent); letter-spacing: -1px; display: flex; align-items: center; gap: 12px; }
        .quote-fav-btn { width: 32px; height: 32px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .quote-fav-btn:hover { border-color: var(--yellow); color: var(--yellow); }
        .quote-fav-btn.filled { color: var(--yellow); border-color: var(--yellow); background: rgba(250,204,21,0.08); }
        .quote-name { font-size: 14px; color: var(--muted); margin-top: 6px; }
        .quote-price { font-family: var(--mono); font-size: 42px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
        .quote-change { font-family: var(--mono); font-size: 16px; font-weight: 600; margin-top: 6px; }
        .quote-meta { display: flex; gap: 32px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 20px; }
        .meta-item { display: flex; flex-direction: column; gap: 4px; }
        .meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
        .meta-value { font-family: var(--mono); font-size: 15px; font-weight: 600; }

        .btn-row { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
        .action-btn { font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 10px 20px; border: none; color: #fff; border-radius: 6px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 8px; }
        .action-btn:active { transform: translateY(0); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .chart-btn { background: linear-gradient(135deg, #22d3a0 0%, #14b8a6 100%); }
        .chart-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(34,211,160,0.35); }
        .analyze-btn { background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%); }
        .analyze-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(59,130,246,0.35); }
        .action-btn .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        .action-btn.loading .spinner { display: block; }
        .action-btn .ai-icon { font-size: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Chart panel */
        .chart-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 28px; display: none; overflow: hidden; }
        .chart-panel.visible { display: block; animation: slideIn 0.35s ease-out; }

        .chart-badge { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--green); background: rgba(34,211,160,0.12); padding: 4px 10px; border-radius: 4px; }
        .chart-title { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text); }
        .chart-range-btns { display: flex; gap: 4px; margin-left: auto; }
        .chart-range-btn { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 5px 10px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; cursor: pointer; transition: all 0.15s; }
        .chart-range-btn:hover { border-color: var(--border-bright); color: var(--text); }
        .chart-range-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
        .chart-panel-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: all 0.15s; line-height: 1; }
        .chart-panel-close:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .chart-body { padding: 24px; position: relative; }
        .chart-canvas-wrap { position: relative; width: 100%; height: 320px; }
        .chart-canvas-wrap canvas { width: 100%; height: 100%; cursor: crosshair; }
        .chart-tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border-bright); border-radius: 6px; padding: 10px 14px; font-family: var(--mono); font-size: 12px; display: none; z-index: 10; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .chart-tooltip .tt-date { color: var(--muted); margin-bottom: 4px; }
        .chart-tooltip .tt-price { font-size: 14px; font-weight: 700; }
        .chart-tooltip .tt-change { font-size: 11px; margin-top: 2px; }

        /* AI panel */
        .ai-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 28px; display: none; overflow: hidden; }
        .ai-panel.visible { display: block; animation: slideIn 0.35s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .ai-panel-header { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--border); background: rgba(59,130,246,0.04); }
        .ai-panel-header .ai-badge { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #a78bfa; background: rgba(167,139,250,0.12); padding: 4px 10px; border-radius: 4px; }
        .ai-panel-header .ai-title { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text); }
        .ai-panel-close { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: all 0.15s; line-height: 1; }

        .ai-panel-body { padding: 24px; }
        .signal-row { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .signal-badge { font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: 1px; padding: 8px 20px; border-radius: 6px; text-transform: uppercase; }
        .signal-badge.buy { background: rgba(34,211,160,0.12); color: var(--green); border: 1px solid rgba(34,211,160,0.3); }
        .signal-badge.sell { background: rgba(244,63,94,0.12); color: var(--red); border: 1px solid rgba(244,63,94,0.3); }
        .signal-badge.hold { background: rgba(250,204,21,0.12); color: var(--yellow); border: 1px solid rgba(250,204,21,0.3); }
        .signal-conf { font-family: var(--mono); font-size: 13px; color: var(--muted); }
        .ai-summary { font-size: 14px; line-height: 1.75; color: var(--text); margin-bottom: 20px; }
        .ai-factors { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .ai-factor { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }

        .ai-disclaimer { font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; margin-top: 8px; line-height: 1.6; font-style: italic; }

        .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; display: none; }
        .table-wrap.visible { display: block; }
        .table-header-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; gap: 12px; flex-wrap: wrap; }
        .table-title { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .export-btn { font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 8px 14px; background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.3); color: var(--orange); border-radius: 5px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }

        td { padding: 11px 16px; font-family: var(--mono); font-size: 13px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }

</head>

    <div class="ticker-strip" id="tickerStrip"></div>

            <div>

                    <span id="qSymbol"></span>

                <div class="quote-change" id="qChange"></div>
            </div>
            <div class="btn-row">

                    <span class="ai-icon">&#9672;</span>
                    <span class="btn-label">Show Chart</span>
                </button>
                <button class="action-btn analyze-btn" id="analyzeBtn" onclick="runAIAnalysis()">
                    <span class="ai-icon">&#10022;</span>
                    <span class="btn-label">Analyze with AI</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </div>
        <div class="quote-meta" id="qMeta"></div>
    </div>

    <!-- Chart Panel -->
    <div class="chart-panel" id="chartPanel">
        <div class="chart-panel-header">
            <span class="chart-badge">Chart</span>
            <span class="chart-title" id="chartTitle"></span>
            <div class="chart-range-btns" id="chartRangeBtns">
                <button class="chart-range-btn" data-range="20" onclick="setChartRange(20, this)">20D</button>
                <button class="chart-range-btn active" data-range="60" onclick="setChartRange(60, this)">60D</button>
                <button class="chart-range-btn" data-range="0" onclick="setChartRange(0, this)">ALL</button>
            </div>
            <button class="chart-panel-close" onclick="closeChart()">&times;</button>
        </div>
        <div class="chart-body">
            <div class="chart-canvas-wrap" id="chartWrap">
                <canvas id="chartCanvas"></canvas>
                <div class="chart-tooltip" id="chartTooltip">
                    <div class="tt-date"></div>
                    <div class="tt-price"></div>
                    <div class="tt-change"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Panel -->
    <div class="ai-panel" id="aiPanel">
        <div class="ai-panel-header">
            <span class="ai-badge">AI Analysis</span>
            <span class="ai-title" id="aiTitle"></span>
            <button class="ai-panel-close" onclick="closeAI()">&times;</button>
        </div>
        <div class="ai-panel-body" id="aiBody"></div>
    </div>

    <!-- Table -->
    <div class="table-wrap" id="tableWrap">
        <div class="table-header-row">
            <div class="table-title" id="tableTitle"></div>
            <button class="export-btn" id="exportBtn" onclick="exportCSV()">
                &#8681; Export CSV
            </button>
        </div>
        <table>
            <thead><tr><th>Date</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Volume</th><th>Change</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>

    function drawChart() {
        if (!currentStockData) return;
        var canvas = chartCanvas;
        var dates = currentStockData.dates;
        var series = currentStockData.series;

        var sliced = chartRange > 0 ? dates.slice(0, chartRange) : dates.slice();
        sliced = sliced.slice().reverse();
        var closes = sliced.map(function(d) { return parseFloat(series[d]['4. close']); });

        chartTitle.textContent = currentStockData.symbol + ' \u2014 ' + sliced.length + ' day close';

        var dpr = window.devicePixelRatio || 1;
        var rect = canvas.parentElement.getBoundingClientRect();
        var W = rect.width;
        var H = rect.height;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        var ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, W, H);

        var padL = 56, padR = 16, padT = 16, padB = 28;
        var cW = W - padL - padR;
        var cH = H - padT - padB;

        var minP = Math.min.apply(null, closes);
        var maxP = Math.max.apply(null, closes);
        var pad = (maxP - minP) * 0.08 || 1;
        minP -= pad;
        maxP += pad;

        var first = closes[0], last = closes[closes.length - 1];
        var isUp = last >= first;
        var line = isUp ? '#22d3a0' : '#f43f5e';
        var fillTop = isUp ? 'rgba(34,211,160,0.25)' : 'rgba(244,63,94,0.25)';
        var fillBot = isUp ? 'rgba(34,211,160,0)' : 'rgba(244,63,94,0)';

        ctx.font = '10px IBM Plex Mono, monospace';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        var gridLines = 5;
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (var i = 0; i <= gridLines; i++) {
            var y = padT + (cH * i / gridLines);
            var p = maxP - ((maxP - minP) * i / gridLines);
            ctx.setLineDash([2, 4]);
            ctx.beginPath();
            ctx.moveTo(padL, y);
            ctx.lineTo(padL + cW, y);
            ctx.stroke();
            ctx.fillText('$' + p.toFixed(2), padL - 8, y);
        }
        ctx.setLineDash([]);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#64748b';
        var xLabels = [0, Math.floor(sliced.length / 2), sliced.length - 1];
        xLabels.forEach(function(idx) {
            var x = padL + (idx / (sliced.length - 1)) * cW;
            ctx.fillText(sliced[idx], x, padT + cH + 16);
        });

        var pts = closes.map(function(c, idx) {
            var x = padL + (idx / (closes.length - 1)) * cW;
            var y = padT + (1 - (c - minP) / (maxP - minP)) * cH;
            return { x: x, y: y };
        });

        var grad = ctx.createLinearGradient(0, padT, 0, padT + cH);
        grad.addColorStop(0, fillTop);
        grad.addColorStop(1, fillBot);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, padT + cH);
        pts.forEach(function(p) { ctx.lineTo(p.x, p.y); });
        ctx.lineTo(pts[pts.length - 1].x, padT + cH);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = line;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        pts.forEach(function(p, idx) {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();

        canvas._chartData = {
            pts: pts, closes: closes, dates: sliced,
            padL: padL, padT: padT, cW: cW, cH: cH, W: W, H: H,
            isUp: isUp, line: line
        };
    }

    (function setupChartHover() {
        var canvas = chartCanvas;
        canvas.addEventListener('mousemove', function(e) {
            var cd = canvas._chartData;
            if (!cd) return;
            var rect = canvas.getBoundingClientRect();
            var mx = e.clientX - rect.left;
            var idx = Math.round(((mx - cd.padL) / cd.cW) * (cd.pts.length - 1));
            if (idx < 0) idx = 0;
            if (idx >= cd.pts.length) idx = cd.pts.length - 1;
            var p = cd.pts[idx];

            var change = idx > 0 ? cd.closes[idx] - cd.closes[idx - 1] : 0;
            var changePct = idx > 0 ? (change / cd.closes[idx - 1] * 100) : 0;
            var chgSign = change >= 0 ? '+' : '';

            chartTooltip.querySelector('.tt-date').textContent = cd.dates[idx];
            chartTooltip.querySelector('.tt-price').textContent = '$' + cd.closes[idx].toFixed(2);
            chartTooltip.querySelector('.tt-price').style.color = cd.isUp ? '#22d3a0' : '#f43f5e';
            chartTooltip.querySelector('.tt-change').textContent = chgSign + change.toFixed(2) + ' (' + chgSign + changePct.toFixed(2) + '%)';
            chartTooltip.querySelector('.tt-change').style.color = change >= 0 ? '#22d3a0' : '#f43f5e';

            var tx = p.x + 16;
            var ty = p.y - 40;
            if (tx + 160 > cd.W) tx = p.x - 170;
            if (ty < 0) ty = p.y + 16;
            chartTooltip.style.left = tx + 'px';
            chartTooltip.style.top = ty + 'px';
            chartTooltip.style.display = 'block';

            drawChart();
            var ctx = canvas.getContext('2d');
            var dpr = window.devicePixelRatio || 1;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(p.x, cd.padT);
            ctx.lineTo(p.x, cd.padT + cd.cH);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = cd.line;
            ctx.lineWidth = 2;
            ctx.stroke();
        });
        canvas.addEventListener('mouseleave', function() {
            chartTooltip.style.display = 'none';
            if (canvas._chartData) drawChart();
        });
    })();

        var closes20 = recentDays.map(function(d) { return parseFloat(series[d]['4. close']); });
        var avg20 = (closes20.reduce(function(a, b) { return a + b; }, 0) / closes20.length).toFixed(2);
        var high20 = Math.max.apply(null, closes20).toFixed(2);
        var low20 = Math.min.apply(null, closes20).toFixed(2);
        var volumes20 = recentDays.map(function(d) { return parseInt(series[d]['5. volume']); });
        var avgVol = Math.round(volumes20.reduce(function(a, b) { return a + b; }, 0) / volumes20.length);

        var prompt = 'You are a stock market analyst. Analyze the following stock data and provide a recommendation.\n\n' +

            var text = data.content.map(function(c) { return c.text || ''; }).join('');

    /* ---------- Load stock ---------- */
    async function loadStock(symbol, name, btn) {
        if (activeSymbol === symbol) return;
        activeSymbol = symbol;
        currentStockData = null;

        document.querySelectorAll('.ticker-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        quoteCard.classList.remove('visible');
        tableWrap.classList.remove('visible');
        aiPanel.classList.remove('visible');
        chartPanel.classList.remove('visible');
        chartVisible = false;
        document.querySelector('#chartBtn .btn-label').textContent = 'Show Chart';
        setStatus('Fetching ' + symbol + '\u2026', 'loading');

        try {
            var url = 'https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=' + symbol + '&outputsize=compact&apikey=5YJCCIC4V6BW3M90';
            var res = await fetch(url);
            var data = await res.json();

            if (data['Note'] || data['Information']) {
                setStatus('API rate limit reached. Try again later.', 'error');
                activeSymbol = null;
                btn.classList.remove('active');
                return;
            }
            var meta = data['Meta Data'];
            var series = data['Time Series (Daily)'];
            if (!series) throw new Error('Unexpected API response');

            var dates = Object.keys(series).sort(function(a, b) { return b.localeCompare(a); });
            var latest = series[dates[0]];
            var prev = series[dates[1]];
            var close = parseFloat(latest['4. close']);
            var prevClose = parseFloat(prev['4. close']);
            var change = close - prevClose;
            var changePct = (change / prevClose) * 100;
            var isUp = change >= 0;

            currentStockData = { symbol: symbol, name: name, series: series, dates: dates };

            document.getElementById('qSymbol').textContent = symbol;
            document.getElementById('qName').textContent = name;
            document.getElementById('qPrice').textContent = '$' + fmt(close);
            updateQuoteFavBtn(isFavorite(symbol));

            var changeEl = document.getElementById('qChange');
            changeEl.textContent = (isUp ? '+' : '') + fmt(change) + ' (' + (isUp ? '+' : '') + fmt(changePct) + '%)';
            changeEl.className = 'quote-change ' + (isUp ? 'up' : 'down');

            document.getElementById('qMeta').innerHTML = [
                { label: 'Open', value: '$' + fmt(latest['1. open']) },
                { label: 'High', value: '$' + fmt(latest['2. high']) },
                { label: 'Low', value: '$' + fmt(latest['3. low']) },
                { label: 'Volume', value: fmtVol(latest['5. volume']) },
                { label: 'Last Updated', value: dates[0] },
                { label: 'Data Points', value: dates.length + ' days' }
            ].map(function(f) {
                return '<div class="meta-item"><span class="meta-label">' + f.label + '</span><span class="meta-value">' + f.value + '</span></div>';
            }).join('');

            quoteCard.classList.add('visible');
            document.getElementById('tableTitle').textContent = symbol + ' \u00B7 Daily Price History';
            tableBody.innerHTML = '';
            dates.forEach(function(date, i) {
                var row = series[date];
                var c = parseFloat(row['4. close']);
                var dayChange = '';
                var dayClass = '';
                if (i < dates.length - 1) {
                    var prevC = parseFloat(series[dates[i + 1]]['4. close']);
                    var diff = c - prevC;
                    var pct = (diff / prevC) * 100;
                    dayClass = diff >= 0 ? 'up' : 'down';
                    dayChange = (diff >= 0 ? '+' : '') + fmt(diff) + ' (' + (diff >= 0 ? '+' : '') + fmt(pct) + '%)';
                }
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + date + '</td><td>$' + fmt(row['1. open']) + '</td><td>$' + fmt(row['2. high']) + '</td><td>$' + fmt(row['3. low']) + '</td><td>$' + fmt(c) + '</td><td>' + fmtVol(row['5. volume']) + '</td><td class="' + dayClass + '">' + dayChange + '</td>';
                tableBody.appendChild(tr);
            });
            tableWrap.classList.add('visible');
            setStatus('\u2713 ' + symbol + ' loaded \u00B7 ' + dates.length + ' trading days \u00B7 last updated ' + meta['3. Last Refreshed'], 'ok');
        } catch (err) {
            setStatus('Error: ' + err.message, 'error');
            activeSymbol = null;
            btn.classList.remove('active');
        }
    }

    (function autoLoadFromUrl() {
        var params = new URLSearchParams(window.location.search);
        var symbolParam = params.get('symbol');
        if (!symbolParam) return;
        var ticker = TICKERS.find(function(t) { return t.symbol === symbolParam.toUpperCase(); });
        if (!ticker) return;
        var btn = document.querySelector('.ticker-btn[data-symbol="' + ticker.symbol + '"]');
        if (btn) loadStock(ticker.symbol, ticker.name, btn);
    })();
</script>
</body>
</html>
